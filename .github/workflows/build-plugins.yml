name: Build plug-ins

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: early-pocket-build-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_VERSION: "8.0.4"

jobs:
  macos:
    name: macOS Universal
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download JUCE 8.0.4
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://github.com/juce-framework/JUCE/releases/download/8.0.4/juce-8.0.4-osx.zip -o juce.zip
          unzip -q juce.zip

      - name: Configure Universal build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Xcode             -DJUCE_DIR="$PWD/JUCE"             -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"             -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0             -DBUILD_TESTING=ON

      - name: Build DSP tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --target EarlyCoreTests --parallel 4
          ctest --test-dir build -C Release --output-on-failure

      - name: Build VST3 and AAX
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --target EarlyPocket_VST3 EarlyPocket_AAX --parallel 4

      - name: Sign and verify macOS plug-ins
        shell: bash
        run: |
          set -euo pipefail
          VST3="build/EarlyPocket_artefacts/Release/VST3/Early Pocket Pro.vst3"
          AAX="build/EarlyPocket_artefacts/Release/AAX/Early Pocket Pro.aaxplugin"

          codesign --force --deep --sign - "$VST3"
          codesign --force --deep --sign - "$AAX"

          codesign --verify --deep --strict --verbose=2 "$VST3"
          codesign --verify --deep --strict --verbose=2 "$AAX"

          lipo "$VST3/Contents/MacOS/Early Pocket Pro" -verify_arch arm64 x86_64
          lipo "$AAX/Contents/MacOS/Early Pocket Pro" -verify_arch arm64 x86_64

          test -f "$VST3/Contents/Resources/moduleinfo.json"

      - name: Validate macOS VST3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip -o pluginval.zip
          unzip -q pluginval.zip
          chmod +x pluginval.app/Contents/MacOS/pluginval
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$PWD/build/EarlyPocket_artefacts/Release/VST3/Early Pocket Pro.vst3" 2>&1 | tee pluginval-macos.log

      - name: Package macOS plug-ins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "build/EarlyPocket_artefacts/Release/VST3/Early Pocket Pro.vst3" "artifacts/Early-Pocket-macOS-Universal-VST3.zip"
          ditto -c -k --sequesterRsrc --keepParent "build/EarlyPocket_artefacts/Release/AAX/Early Pocket Pro.aaxplugin" "artifacts/Early-Pocket-macOS-Universal-AAX.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Early-Pocket-macOS-Universal-VST3
          path: artifacts/Early-Pocket-macOS-Universal-VST3.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Early-Pocket-macOS-Universal-AAX
          path: artifacts/Early-Pocket-macOS-Universal-AAX.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-log-macos
          path: pluginval-macos.log
          if-no-files-found: ignore

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download JUCE 8.0.4
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.4.zip -OutFile juce.zip
          Expand-Archive juce.zip -DestinationPath juce-unpack
          Move-Item juce-unpack/JUCE-8.0.4 JUCE

      - name: Configure x64 build
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 "-DJUCE_DIR=${{ github.workspace }}\JUCE" -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build DSP tests
        shell: pwsh
        run: |
          cmake --build build --config Release --target EarlyCoreTests --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build VST3 and AAX
        shell: pwsh
        run: |
          cmake --build build --config Release --target EarlyPocket_VST3 EarlyPocket_AAX --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Windows VST3
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval-unpack
          $validator = (Get-ChildItem pluginval-unpack -Recurse -Filter pluginval.exe | Select-Object -First 1).FullName
          if (-not $validator) { throw "pluginval executable not found" }
          & $validator --strictness-level 5 --validate "$PWD/build/EarlyPocket_artefacts/Release/VST3/Early Pocket Pro.vst3" 2>&1 | Tee-Object -FilePath pluginval-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows plug-ins
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "build/EarlyPocket_artefacts/Release/VST3/Early Pocket Pro.vst3" -DestinationPath "artifacts/Early-Pocket-Windows-x64-VST3.zip" -Force
          Compress-Archive -Path "build/EarlyPocket_artefacts/Release/AAX/Early Pocket Pro.aaxplugin" -DestinationPath "artifacts/Early-Pocket-Windows-x64-AAX.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Early-Pocket-Windows-x64-VST3
          path: artifacts/Early-Pocket-Windows-x64-VST3.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Early-Pocket-Windows-x64-AAX
          path: artifacts/Early-Pocket-Windows-x64-AAX.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-log-windows
          path: pluginval-windows.log
          if-no-files-found: ignore
