name: Build Windows plug-ins

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_aax:
        description: Also build AAX Native (requires an authorized AAX SDK download URL secret)
        required: false
        default: false
        type: boolean

jobs:
  windows-x64:
    runs-on: windows-2022
    env:
      AAX_SDK_URL: ${{ secrets.AAX_SDK_URL }}
      AAX_SDK_TOKEN: ${{ secrets.AAX_SDK_TOKEN }}
    steps:
      - name: Check out Early Pocket
        uses: actions/checkout@v4

      - name: Check out JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE
          fetch-depth: 1

      - name: Configure and build Windows VST3
        if: ${{ !inputs.build_aax }}
        shell: pwsh
        run: |
          cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64 "-DJUCE_DIR=$env:GITHUB_WORKSPACE\JUCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-win --config Release --target EarlyPocket_VST3 --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure and build Windows VST3 and AAX Native
        if: ${{ inputs.build_aax }}
        shell: pwsh
        run: |
          if (-not $env:AAX_SDK_URL) { throw "Set the AAX_SDK_URL repository secret to an authorized AAX SDK 2.9 ZIP URL." }
          $headers = @{}
          if ($env:AAX_SDK_TOKEN) { $headers.Authorization = "Bearer $env:AAX_SDK_TOKEN" }
          $sdkZip = Join-Path $env:RUNNER_TEMP "aax-sdk.zip"
          $sdkRoot = Join-Path $env:RUNNER_TEMP "aax-sdk"
          Invoke-WebRequest -Uri $env:AAX_SDK_URL -Headers $headers -OutFile $sdkZip
          Expand-Archive -Path $sdkZip -DestinationPath $sdkRoot -Force
          $header = Get-ChildItem -Path $sdkRoot -Filter AAX.h -Recurse | Select-Object -First 1
          if (-not $header) { throw "The downloaded archive does not contain Interfaces/AAX.h." }
          $sdkPath = Split-Path (Split-Path $header.FullName -Parent) -Parent
          cmake -S . -B build-win-aax -G "Visual Studio 17 2022" -A x64 "-DJUCE_DIR=$env:GITHUB_WORKSPACE\JUCE" "-DAAX_SDK_PATH=$sdkPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-win-aax --config Release --target EarlyPocket_VST3 EarlyPocket_AAX --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload VST3 and AAX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Early-Pocket-Windows-x64
          path: |
            build-win/EarlyPocket_artefacts/Release/VST3/Early Pocket.vst3
            build-win-aax/EarlyPocket_artefacts/Release/VST3/Early Pocket.vst3
            build-win-aax/EarlyPocket_artefacts/Release/AAX/Early Pocket.aaxplugin
          if-no-files-found: error
